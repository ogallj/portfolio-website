<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="card-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-slate)"/>

  <!-- Presentation Header -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#DC2626" letter-spacing="2">PRINT &amp; STATIONERY COLLATERAL</text>
    <text x="0" y="32" font-family="'Clash Display', sans-serif" font-size="28" font-weight="700" fill="#0F172A">B-Wallex Corporate Identity Suite</text>
  </g>

  <!-- Letterhead Mockup (A4 Ratio) -->
  <g transform="translate(100, 140)" filter="url(#card-drop)">
    <rect width="450" height="600" rx="6" fill="#FFFFFF"/>
    
    <!-- Top Letterhead Branding -->
    <rect x="0" y="0" width="450" height="10" fill="url(#gold-foil)"/>
    <g transform="translate(45, 45)">
      <polygon points="18,5 34,14 34,32 18,41 2,32 2,14" fill="none" stroke="#DC2626" stroke-width="2.5"/>
      <text x="45" y="28" font-family="'Clash Display', sans-serif" font-size="20" font-weight="700" fill="#0F172A">B-Wallex</text>
      <text x="45" y="42" font-family="'Satoshi', sans-serif" font-size="9" fill="#94A3B8" letter-spacing="1">PAYMENTS ARCHITECTURE</text>
    </g>
    
    <!-- Letterhead Right Info -->
    <text x="405" y="65" font-family="'Satoshi', sans-serif" font-size="10" fill="#64748B" text-anchor="end">Nairobi Financial Centre, Level 14</text>
    <text x="405" y="80" font-family="'Satoshi', sans-serif" font-size="10" fill="#64748B" text-anchor="end">gateway@b-wallex.com • www.b-wallex.com</text>

    <line x1="45" y1="110" x2="405" y2="110" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Document Dummy Content -->
    <text x="45" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0F172A">MERCHANT INTEGRATION SPECIFICATION</text>
    <text x="45" y="175" font-family="'Satoshi', sans-serif" font-size="11" fill="#475569">Reference ID: BW-SYS-2024-089</text>

    <!-- Paragraph Lines -->
    <g fill="#94A3B8">
      <rect x="45" y="210" width="360" height="8" rx="3" opacity="0.6"/>
      <rect x="45" y="230" width="340" height="8" rx="3" opacity="0.5"/>
      <rect x="45" y="250" width="355" height="8" rx="3" opacity="0.5"/>
      <rect x="45" y="270" width="280" height="8" rx="3" opacity="0.4"/>

      <rect x="45" y="310" width="360" height="8" rx="3" opacity="0.6"/>
      <rect x="45" y="330" width="330" height="8" rx="3" opacity="0.5"/>
      <rect x="45" y="350" width="350" height="8" rx="3" opacity="0.5"/>
      <rect x="45" y="370" width="220" height="8" rx="3" opacity="0.4"/>
    </g>

    <!-- Gold Foil Stamp Seal -->
    <circle cx="360" cy="490" r="32" fill="none" stroke="url(#gold-foil)" stroke-width="2"/>
    <circle cx="360" cy="490" r="28" fill="url(#gold-foil)" opacity="0.15"/>
    <text x="360" y="493" font-family="'Satoshi', sans-serif" font-size="8" font-weight="800" fill="#B45309" text-anchor="middle" letter-spacing="1">AUTHENTIC</text>

    <!-- Footer Bar -->
    <rect x="0" y="588" width="450" height="12" fill="#0F172A"/>
  </g>

  <!-- Business Card Front & Back (3D Isometric Stack) -->
  <g transform="translate(640, 160)">
    <!-- Card Back (Matte Obsidian & Gold Hot-Stamping) -->
    <g transform="rotate(-6, 180, 110)" filter="url(#card-drop)">
      <rect width="400" height="240" rx="14" fill="#090D16" stroke="url(#gold-foil)" stroke-width="1.5"/>
      <g transform="translate(130, 80)">
        <polygon points="32,8 58,22 58,52 32,66 6,52 6,22" fill="none" stroke="url(#gold-foil)" stroke-width="3"/>
        <path d="M22,25 Q35,21 40,31 Q44,40 30,48" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="22" y1="25" x2="22" y2="48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        <text x="75" y="44" font-family="'Clash Display', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">B-Wallex</text>
        <text x="75" y="60" font-family="'Satoshi', sans-serif" font-size="10" font-weight="700" fill="url(#gold-foil)" letter-spacing="3">GLOBAL FINTECH</text>
      </g>
    </g>

    <!-- Card Front (Pearl Canvas with Red & Gold Details) -->
    <g transform="translate(50, 220) rotate(4, 200, 120)" filter="url(#card-drop)">
      <rect width="400" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- Top Color Accent -->
      <path d="M0,0 L400,0 L400,8 L0,8 Z" fill="#DC2626"/>
      <g transform="translate(40, 45)">
        <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A">Joshua Odero Ogallo</text>
        <text x="0" y="38" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#DC2626">Chief Technology &amp; Experience Designer</text>
        
        <line x1="0" y1="58" x2="160" y2="58" stroke="url(#gold-foil)" stroke-width="2"/>

        <g transform="translate(0, 80)" font-family="'Satoshi', sans-serif" font-size="11" fill="#475569">
          <text x="0" y="0">E: joshua@b-wallex.com</text>
          <text x="0" y="20">T: +254 (0) 700 000 000</text>
          <text x="0" y="40">W: www.b-wallex.com/gateway</text>
        </g>
      </g>
      <!-- Small Corner Monogram -->
      <g transform="translate(320, 160)">
        <polygon points="18,5 34,14 34,32 18,41 2,32 2,14" fill="none" stroke="#DC2626" stroke-width="2"/>
        <circle cx="18" cy="23" r="4" fill="url(#gold-foil)"/>
      </g>
    </g>
  </g>
</svg>
