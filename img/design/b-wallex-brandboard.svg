<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bb-bg)"/>
  <rect width="1200" height="900" fill="url(#dot-grid)"/>

  <!-- Brand Board Header -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#DC2626" letter-spacing="3">BRAND SYSTEM GUIDELINES</text>
    <text x="0" y="38" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="700" fill="#0F172A">B-Wallex Visual Identity System</text>
    <text x="0" y="65" font-family="'Satoshi', sans-serif" font-size="15" fill="#64748B">Version 2.4 • Cross-Border Fintech Architecture • Designed by Joshua Odero Ogallo</text>
  </g>

  <!-- Section 1: Logo Architecture & Construction -->
  <g transform="translate(80, 180)">
    <!-- Panel 1: Primary Lockup (Light) -->
    <rect x="0" y="0" width="320" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Satoshi', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">PRIMARY MARK (LIGHT BG)</text>
    <g transform="translate(50, 80)">
      <polygon points="30,8 55,22 55,50 30,64 6,50 6,22" fill="none" stroke="#DC2626" stroke-width="4"/>
      <path d="M22,24 Q35,20 40,30 Q44,39 30,46" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
      <line x1="22" y1="24" x2="22" y2="46" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
      <text x="75" y="44" font-family="'Clash Display', sans-serif" font-size="28" font-weight="700" fill="#0F172A">B-Wallex</text>
    </g>

    <!-- Panel 2: Primary Lockup (Dark) -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="320" height="220" rx="16" fill="#0F172A"/>
      <text x="24" y="32" font-family="'Satoshi', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">REVERSE LOCKUP (DARK BG)</text>
      <g transform="translate(50, 80)">
        <polygon points="30,8 55,22 55,50 30,64 6,50 6,22" fill="none" stroke="#EF4444" stroke-width="4"/>
        <path d="M22,24 Q35,20 40,30 Q44,39 30,46" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
        <line x1="22" y1="24" x2="22" y2="46" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
        <text x="75" y="44" font-family="'Clash Display', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">B-Wallex</text>
      </g>
    </g>

    <!-- Panel 3: Monogram / App Icon -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="340" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="24" y="32" font-family="'Satoshi', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">APP ICON &amp; FAVICON (GRID-TESTED)</text>
      <g transform="translate(45, 65)">
        <rect width="90" height="90" rx="22" fill="url(#crimson-grad)"/>
        <polygon points="45,18 70,32 70,60 45,74 20,60 20,32" fill="none" stroke="#FDE047" stroke-width="3"/>
        <path d="M35,35 Q48,31 52,41 Q55,50 42,56" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="35" y1="35" x2="35" y2="56" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(160, 65)">
        <rect width="90" height="90" rx="22" fill="#0F172A" stroke="url(#gold-grad)" stroke-width="2"/>
        <polygon points="45,18 70,32 70,60 45,74 20,60 20,32" fill="none" stroke="#EF4444" stroke-width="3"/>
        <path d="M35,35 Q48,31 52,41 Q55,50 42,56" fill="none" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="35" y1="35" x2="35" y2="56" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Section 2: Color Palette Specification -->
  <g transform="translate(80, 440)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0F172A" letter-spacing="1">CHROMATIC ARCHITECTURE</text>
    <g transform="translate(0, 20)">
      <!-- Swatch 1 -->
      <rect x="0" y="0" width="240" height="120" rx="12" fill="#DC2626"/>
      <text x="20" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Crimson Core</text>
      <text x="20" y="100" font-family="'Satoshi', sans-serif" font-size="13" fill="#FECACA">HEX #DC2626 • Primary</text>

      <!-- Swatch 2 -->
      <rect x="260" y="0" width="240" height="120" rx="12" fill="#D4AF37"/>
      <text x="280" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Sovereign Gold</text>
      <text x="280" y="100" font-family="'Satoshi', sans-serif" font-size="13" fill="#FEF3C7">HEX #D4AF37 • Metallic</text>

      <!-- Swatch 3 -->
      <rect x="520" y="0" width="240" height="120" rx="12" fill="#0F172A"/>
      <text x="540" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Deep Obsidian</text>
      <text x="540" y="100" font-family="'Satoshi', sans-serif" font-size="13" fill="#94A3B8">HEX #0F172A • Interface Dark</text>

      <!-- Swatch 4 -->
      <rect x="780" y="0" width="260" height="120" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="800" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Pearl Canvas</text>
      <text x="800" y="100" font-family="'Satoshi', sans-serif" font-size="13" fill="#64748B">HEX #F8FAFC • Clean Surface</text>
    </g>
  </g>

  <!-- Section 3: Typography Hierarchy & Spacing -->
  <g transform="translate(80, 630)">
    <rect x="0" y="0" width="1040" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(40, 45)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#DC2626" letter-spacing="1">TYPOGRAPHIC SPECIMENS</text>
      <text x="0" y="45" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700" fill="#0F172A">Clash Display &amp; Plus Jakarta Sans</text>
      <text x="0" y="75" font-family="'Playfair Display', serif" font-style="italic" font-size="22" fill="#D4AF37">Playfair Display Italic Accent for editorial finesse and trust</text>
      <text x="0" y="105" font-family="'Satoshi', sans-serif" font-size="15" fill="#475569">Satoshi Body: High legibility interface text across mobile, web &amp; printed merchant statements.</text>
    </g>
    <g transform="translate(740, 50)">
      <text x="0" y="0" font-family="'Satoshi', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">MINIMUM SIZE</text>
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#0F172A">Print: 18mm | Web: 24px</text>
      <text x="0" y="55" font-family="'Satoshi', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">CLEARSPACE</text>
      <text x="0" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#0F172A">0.5X of Hexagon Height</text>
    </g>
  </g>
</svg>
