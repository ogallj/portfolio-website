<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#180A0A"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#DC2626" flood-opacity="0.3"/>
    </filter>
    <pattern id="grid-pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="800" fill="url(#bg-grad)"/>
  <rect width="1200" height="800" fill="url(#grid-pat)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="280" fill="#DC2626" opacity="0.18" filter="blur(90px)"/>
  <circle cx="1020" cy="620" r="260" fill="#D4AF37" opacity="0.14" filter="blur(80px)"/>

  <!-- Geometric Decorative Lines -->
  <path d="M-50,650 C300,500 500,750 900,450 C1100,300 1250,550 1300,500" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M-50,680 C320,530 520,780 920,480 C1120,330 1270,580 1320,530" fill="none" stroke="url(#crimson-grad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Left Side: Brand Meta & Typography Overview -->
  <g transform="translate(100, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="4" fill="#D4AF37"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FDE047" letter-spacing="1.5">FINTECH BRAND IDENTITY</text>

    <!-- Project Title -->
    <text x="0" y="95" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="-1">B-Wallex</text>
    <text x="250" y="95" font-family="'Playfair Display', serif" font-style="italic" font-size="44" fill="#D4AF37">Systems</text>

    <!-- Subtitle -->
    <text x="0" y="140" font-family="'Satoshi', sans-serif" font-size="20" fill="#94A3B8" font-weight="400">Cross-Border Payment Gateway &amp; Merchant Identity</text>
    <text x="0" y="170" font-family="'Satoshi', sans-serif" font-size="15" fill="#64748B">Logo Architecture • Visual Guidelines • Digital &amp; Card System</text>

    <!-- Design Pillars -->
    <g transform="translate(0, 230)">
      <!-- Item 1 -->
      <circle cx="16" cy="16" r="16" fill="#DC2626" fill-opacity="0.2"/>
      <path d="M 11 16 L 15 20 L 22 12" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
      <text x="44" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Trust &amp; Security</text>
      <text x="44" y="32" font-family="'Satoshi', sans-serif" font-size="12" fill="#94A3B8">Shield geometry &amp; precision lockup</text>

      <!-- Item 2 -->
      <g transform="translate(0, 55)">
        <circle cx="16" cy="16" r="16" fill="#D4AF37" fill-opacity="0.2"/>
        <path d="M 11 16 L 15 20 L 22 12" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Fluid Currency Velocity</text>
        <text x="44" y="32" font-family="'Satoshi', sans-serif" font-size="12" fill="#94A3B8">Metallic arcs signaling transaction flow</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 110)">
        <circle cx="16" cy="16" r="16" fill="#DC2626" fill-opacity="0.2"/>
        <path d="M 11 16 L 15 20 L 22 12" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
        <text x="44" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Omnichannel Cohesion</text>
        <text x="44" y="32" font-family="'Satoshi', sans-serif" font-size="12" fill="#94A3B8">Physical cards, mobile apps &amp; POS terminals</text>
      </g>
    </g>

    <!-- Year & Tool Tags -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="40" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">2024</text>

      <rect x="90" y="0" width="100" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="140" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Illustrator</text>

      <rect x="200" y="0" width="80" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="240" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Figma</text>
    </g>
  </g>

  <!-- Right Side: 3D-Styled Premium Brand Mockup Cards -->
  <g transform="translate(680, 180)">
    <!-- Back Card (Silver/Dark Platinum) -->
    <g transform="rotate(-12, 180, 220)" filter="url(#shadow)">
      <rect x="20" y="40" width="400" height="250" rx="20" fill="#090D16" stroke="url(#crimson-grad)" stroke-width="2"/>
      <circle cx="80" cy="90" r="28" fill="#DC2626" opacity="0.2"/>
      <text x="80" y="97" font-family="'Clash Display', sans-serif" font-size="20" font-weight="700" fill="#EF4444" text-anchor="middle">B</text>
      <text x="125" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">B-Wallex</text>
      <text x="360" y="93" font-family="'Satoshi', sans-serif" font-size="13" font-weight="700" fill="#F59E0B">PLATINUM</text>
      
      <!-- Card EMV Chip -->
      <rect x="70" y="135" width="45" height="34" rx="6" fill="url(#gold-grad)"/>
      
      <!-- Card Number Preview -->
      <text x="70" y="205" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#94A3B8" letter-spacing="4">••••  ••••  ••••  8924</text>
      <text x="70" y="240" font-family="'Satoshi', sans-serif" font-size="11" fill="#64748B">VAL THRU 09/29</text>
      <text x="250" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">MERCHANT SETTLEMENT</text>
    </g>

    <!-- Front Card (Imperial Crimson & Liquid Gold) -->
    <g transform="translate(40, 160) rotate(8, 200, 130)" filter="url(#shadow)">
      <rect x="0" y="0" width="410" height="260" rx="22" fill="url(#card-grad)" stroke="url(#gold-grad)" stroke-width="2.5"/>
      <rect x="0" y="0" width="410" height="260" rx="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      
      <!-- Abstract Wave Cutout -->
      <path d="M0,80 Q200,20 410,130 L410,260 L0,260 Z" fill="url(#crimson-grad)" opacity="0.35"/>
      <path d="M0,130 Q180,70 410,180 L410,260 L0,260 Z" fill="url(#gold-grad)" opacity="0.25"/>

      <!-- Brand Mark Icon -->
      <g transform="translate(45, 45)">
        <polygon points="25,5 45,16 45,39 25,50 5,39 5,16" fill="none" stroke="url(#gold-grad)" stroke-width="3"/>
        <path d="M18,18 Q28,15 32,23 Q35,30 25,35" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="18" x2="18" y2="35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <text x="60" y="32" font-family="'Clash Display', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">B-Wallex</text>
        <text x="60" y="47" font-family="'Satoshi', sans-serif" font-size="10" font-weight="600" fill="#FDE047" letter-spacing="2">PAYMENT CORE</text>
      </g>

      <!-- Contactless Wave Icon -->
      <g transform="translate(340, 48)" stroke="#FDE047" stroke-width="2" fill="none">
        <path d="M0,5 A8,8 0 0,1 0,25" stroke-linecap="round"/>
        <path d="M6,2 A14,14 0 0,1 6,28" stroke-linecap="round"/>
        <path d="M12,-1 A20,20 0 0,1 12,31" stroke-linecap="round"/>
      </g>

      <!-- EMV Gold Chip -->
      <g transform="translate(45, 120)">
        <rect width="48" height="36" rx="6" fill="url(#gold-grad)"/>
        <line x1="16" y1="0" x2="16" y2="36" stroke="#B45309" stroke-width="1"/>
        <line x1="32" y1="0" x2="32" y2="36" stroke="#B45309" stroke-width="1"/>
        <line x1="0" y1="18" x2="48" y2="18" stroke="#B45309" stroke-width="1"/>
      </g>

      <!-- Card Details -->
      <text x="45" y="195" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#F8FAFC" letter-spacing="3">5412  7589  3310  4218</text>
      <text x="45" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">JOSHUA O. OGALLO</text>
      <text x="280" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FDE047">GLOBAL ELITE</text>
    </g>

    <!-- Color Swatches Float -->
    <g transform="translate(20, 460)">
      <rect x="0" y="0" width="370" height="50" rx="14" fill="#0F172A" fill-opacity="0.9" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
      <!-- Swatch 1 -->
      <circle cx="35" cy="25" r="14" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="58" y="23" font-family="'Satoshi', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">#DC2626</text>
      <text x="58" y="36" font-family="'Satoshi', sans-serif" font-size="9" fill="#94A3B8">Crimson</text>
      <!-- Swatch 2 -->
      <circle cx="135" cy="25" r="14" fill="#D4AF37" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="158" y="23" font-family="'Satoshi', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">#D4AF37</text>
      <text x="158" y="36" font-family="'Satoshi', sans-serif" font-size="9" fill="#94A3B8">Gold</text>
      <!-- Swatch 3 -->
      <circle cx="235" cy="25" r="14" fill="#0F172A" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <text x="258" y="23" font-family="'Satoshi', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">#0F172A</text>
      <text x="258" y="36" font-family="'Satoshi', sans-serif" font-size="9" fill="#94A3B8">Obsidian</text>
    </g>
  </g>
</svg>
