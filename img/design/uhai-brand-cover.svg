<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="uhai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="cyan-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="pos-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#uhai-bg)"/>

  <!-- Glowing Radial Core -->
  <circle cx="950" cy="400" r="280" fill="#0284C7" opacity="0.15" filter="blur(80px)"/>

  <!-- Left Side: Project Details -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.6"/>
    <circle cx="18" cy="17" r="4" fill="#38BDF8"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.5">POS BRAND &amp; SYSTEM</text>

    <text x="0" y="95" font-family="'Clash Display', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Uhai POS</text>
    <text x="240" y="95" font-family="'Playfair Display', serif" font-style="italic" font-size="44" fill="#FDE047">Brand Identity</text>

    <text x="0" y="145" font-family="'Satoshi', sans-serif" font-size="19" fill="#94A3B8">Retail Ecosystem Brand Architecture &amp; Merchant Interface Graphics</text>
    <text x="0" y="175" font-family="'Satoshi', sans-serif" font-size="15" fill="#64748B">Logo System • Hardware Screen Branding • Merchant Badges • Marketing Collateral</text>

    <g transform="translate(0, 230)" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#E2E8F0">
      <circle cx="12" cy="12" r="6" fill="#38BDF8"/>
      <text x="32" y="17">Dynamic Retail Heartbeat Pulse Geometry</text>

      <circle cx="12" cy="52" r="6" fill="#FDE047"/>
      <text x="32" y="57">High-Contrast Touchscreen UI Typography</text>

      <circle cx="12" cy="92" r="6" fill="#38BDF8"/>
      <text x="32" y="97">Merchant Storefront Window Badges &amp; Stickers</text>
    </g>

    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#1E293B"/>
      <text x="35" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2025</text>
      <rect x="80" y="0" width="130" height="28" rx="6" fill="#1E293B"/>
      <text x="145" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Brand Identity</text>
      <rect x="220" y="0" width="120" height="28" rx="6" fill="#1E293B"/>
      <text x="280" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">UI / Visual Design</text>
    </g>
  </g>

  <!-- Right Side: Branded Tablet POS Screen & Storefront Seal -->
  <g transform="translate(660, 180)">
    <!-- Tablet Frame Mockup (Landscape POS terminal) -->
    <g filter="url(#pos-shadow)">
      <rect width="460" height="310" rx="20" fill="#0A0A0A" stroke="#475569" stroke-width="3"/>
      <!-- Tablet Display -->
      <rect x="12" y="12" width="436" height="286" rx="14" fill="#0F172A"/>
      
      <!-- Top Bar inside Tablet -->
      <rect x="12" y="12" width="436" height="42" rx="14 14 0 0" fill="#1E293B"/>
      <!-- Logo in tablet -->
      <circle cx="35" cy="33" r="10" fill="url(#cyan-teal)"/>
      <text x="52" y="38" font-family="'Clash Display', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Uhai POS</text>
      <text x="430" y="38" font-family="'Satoshi', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">TERMINAL ACTIVE • STATION 01</text>

      <!-- Quick Item Tiles inside POS UI -->
      <g transform="translate(30, 75)">
        <rect width="80" height="80" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="40" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">☕</text>
        <text x="40" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Espresso</text>

        <rect x="95" width="80" height="80" rx="10" fill="#1E293B"/>
        <text x="135" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">🥐</text>
        <text x="135" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bakery</text>

        <rect x="190" width="80" height="80" rx="10" fill="#1E293B"/>
        <text x="230" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">🥗</text>
        <text x="230" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Salads</text>
      </g>

      <!-- Cart Side Summary -->
      <g transform="translate(320, 75)">
        <rect width="110" height="205" rx="10" fill="#1E293B"/>
        <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">ORDER #142</text>
        <text x="12" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#38BDF8">KSh 940</text>
        <rect x="10" y="150" width="90" height="35" rx="8" fill="url(#cyan-teal)"/>
        <text x="55" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">CHARGE</text>
      </g>
    </g>

    <!-- Merchant Storefront Window Badge (Round Decal) -->
    <g transform="translate(260, 260)" filter="url(#pos-shadow)">
      <circle cx="70" cy="70" r="70" fill="#0A0A0A" stroke="url(#gold-accent)" stroke-width="3"/>
      <circle cx="70" cy="70" r="62" fill="#0284C7" opacity="0.2"/>
      <circle cx="70" cy="50" r="22" fill="url(#cyan-teal)"/>
      <text x="70" y="56" font-family="'Clash Display', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">U</text>
      <text x="70" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">UHAI VERIFIED</text>
      <text x="70" y="110" font-family="'Satoshi', sans-serif" font-size="8" fill="#FDE047" text-anchor="middle">OFFICIAL MERCHANT</text>
    </g>
  </g>
</svg>
