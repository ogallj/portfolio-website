<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="baruch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1A0D12"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="prism-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#EAB308" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#baruch-bg)"/>

  <!-- Geometric Tech Grid Accents -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Left Side: Copy & Info -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#EAB308" fill-opacity="0.15" stroke="#EAB308" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="4" fill="#EAB308"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FDE047" letter-spacing="1.5">TECH BRAND &amp; PRINT</text>

    <text x="0" y="95" font-family="'Clash Display', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Baruchsoft</text>
    <text x="290" y="95" font-family="'Playfair Display', serif" font-style="italic" font-size="44" fill="#FDE047">Technologies</text>

    <text x="0" y="145" font-family="'Satoshi', sans-serif" font-size="19" fill="#94A3B8">Enterprise Cloud &amp; Systems Brand Identity Architecture</text>
    <text x="0" y="175" font-family="'Satoshi', sans-serif" font-size="15" fill="#64748B">Brand Identity • Marketing Materials • Roll-up Banners • Digital Collateral</text>

    <g transform="translate(0, 230)" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#E2E8F0">
      <circle cx="12" cy="12" r="6" fill="#DC2626"/>
      <text x="32" y="17">Isometric Prism Monogram System</text>

      <circle cx="12" cy="52" r="6" fill="#EAB308"/>
      <text x="32" y="57">Conference Roll-up Banners &amp; Signage</text>

      <circle cx="12" cy="92" r="6" fill="#DC2626"/>
      <text x="32" y="97">Enterprise Pitch Decks &amp; Executive Stationery</text>
    </g>

    <!-- Meta Tags -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#1E293B"/>
      <text x="35" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2024</text>
      <rect x="80" y="0" width="110" height="28" rx="6" fill="#1E293B"/>
      <text x="135" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Brand Identity</text>
      <rect x="200" y="0" width="100" height="28" rx="6" fill="#1E293B"/>
      <text x="250" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Print &amp; Rollup</text>
    </g>
  </g>

  <!-- Right Side: 3D Roll-up Banner & Brand Mark Display -->
  <g transform="translate(680, 100)">
    <!-- Roll-up Banner Mockup (Perspective Stand) -->
    <g transform="translate(260, 40) rotate(5)" filter="url(#card-shadow)">
      <!-- Banner Base Aluminum Cassette -->
      <rect x="-15" y="590" width="230" height="25" rx="5" fill="#475569" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="15" y="615" width="40" height="15" fill="#334155"/>
      <rect x="145" y="615" width="40" height="15" fill="#334155"/>

      <!-- Banner Canvas (850x2000mm Ratio) -->
      <rect x="0" y="0" width="200" height="590" rx="4" fill="#0F172A" stroke="#DC2626" stroke-width="2"/>
      <!-- Top banner strip -->
      <rect x="0" y="0" width="200" height="8" fill="url(#gold-bright)"/>
      
      <!-- Content on Roll-up Banner -->
      <g transform="translate(25, 45)">
        <!-- Logo -->
        <polygon points="20,0 40,12 40,36 20,48 0,36 0,12" fill="none" stroke="url(#gold-bright)" stroke-width="2.5"/>
        <path d="M12,18 L28,18 L28,26 L12,26 L28,34 L12,34" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <text x="50" y="24" font-family="'Clash Display', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Baruchsoft</text>
        <text x="50" y="38" font-family="'Satoshi', sans-serif" font-size="9" fill="#94A3B8">ENTERPRISE TECH</text>

        <!-- Big Headline -->
        <text x="0" y="110" font-family="'Clash Display', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">ARCHITECTING</text>
        <text x="0" y="136" font-family="'Playfair Display', serif" font-style="italic" font-size="20" fill="#FDE047">INTELLIGENT</text>
        <text x="0" y="162" font-family="'Clash Display', sans-serif" font-size="22" font-weight="700" fill="#DC2626">SYSTEMS.</text>

        <!-- Graphic Feature -->
        <circle cx="75" cy="240" r="45" fill="none" stroke="url(#gold-bright)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <circle cx="75" cy="240" r="32" fill="#DC2626" opacity="0.3"/>
        <text x="75" y="246" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">CLOUD</text>

        <g transform="translate(0, 320)" font-family="'Satoshi', sans-serif" font-size="9" fill="#CBD5E1">
          <text x="0" y="0">✓ High-Availability Infrastructure</text>
          <text x="0" y="22">✓ Microservices &amp; API Security</text>
          <text x="0" y="44">✓ Custom Enterprise Software</text>
        </g>

        <!-- QR Code Placeholder -->
        <g transform="translate(45, 410)">
          <rect width="60" height="60" fill="#FFFFFF" rx="6"/>
          <rect x="8" y="8" width="16" height="16" fill="#0F172A"/>
          <rect x="36" y="8" width="16" height="16" fill="#0F172A"/>
          <rect x="8" y="36" width="16" height="16" fill="#0F172A"/>
          <rect x="28" y="28" width="8" height="8" fill="#DC2626"/>
        </g>
        <text x="75" y="490" font-family="'Satoshi', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">baruchsoft.com</text>
      </g>
    </g>

    <!-- Isometric Tech Brand Mark (Left of banner) -->
    <g transform="translate(20, 180)" filter="url(#card-shadow)">
      <rect width="250" height="250" rx="28" fill="#1E293B" stroke="url(#gold-bright)" stroke-width="2"/>
      <g transform="translate(65, 55)">
        <!-- 3D Cube / Monogram 'B' -->
        <polygon points="60,0 120,35 60,70 0,35" fill="url(#gold-bright)"/>
        <polygon points="0,35 60,70 60,140 0,105" fill="#B45309"/>
        <polygon points="120,35 60,70 60,140 120,105" fill="url(#prism-crimson)"/>
        <!-- Inner Letter Cut -->
        <path d="M40,55 L80,55 L80,75 L40,75 L80,95 L40,95" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="125" y="220" font-family="'Clash Display', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE MONOGRAM</text>
    </g>
  </g>
</svg>
