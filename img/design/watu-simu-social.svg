<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="social-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F14"/>
      <stop offset="100%" stop-color="#240707"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="post-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#DC2626" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#social-bg)"/>

  <!-- Presentation Header -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FDE047" letter-spacing="2">SOCIAL MEDIA CAROUSEL &amp; DIGITAL ADS</text>
    <text x="0" y="34" font-family="'Clash Display', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Watu Simu Multichannel Promotional Kit</text>
  </g>

  <!-- Instagram Feed Post 1: Announcement (1080x1080 Aspect) -->
  <g transform="translate(80, 140)" filter="url(#post-shadow)">
    <rect width="320" height="320" rx="16" fill="#180404" stroke="#DC2626" stroke-width="1.5"/>
    <g transform="translate(25, 30)">
      <rect width="90" height="24" rx="12" fill="#DC2626"/>
      <text x="45" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">OFFER ALERT</text>

      <text x="0" y="80" font-family="'Clash Display', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">OWN A SMARTPHONE</text>
      <text x="0" y="112" font-family="'Playfair Display', serif" font-style="italic" font-size="28" fill="#FDE047">Today with Zero Stress</text>
      
      <circle cx="210" cy="180" r="45" fill="#DC2626" opacity="0.3"/>
      <text x="0" y="170" font-family="'Satoshi', sans-serif" font-size="13" fill="#FECACA">Deposit from KSh 1,999</text>
      <text x="0" y="195" font-family="'Satoshi', sans-serif" font-size="13" fill="#FECACA">Pay as low as KSh 60 daily</text>

      <rect y="225" width="270" height="36" rx="18" fill="url(#gold-grad)"/>
      <text x="135" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0F0F14" text-anchor="middle">VISIT YOUR NEAREST STORE</text>
    </g>
  </g>

  <!-- Instagram Feed Post 2: Device Comparison & Features -->
  <g transform="translate(440, 140)" filter="url(#post-shadow)">
    <rect width="320" height="320" rx="16" fill="#0A0A10" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <g transform="translate(25, 30)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FDE047">DEVICE LINEUP 2024</text>
      <text x="0" y="55" font-family="'Clash Display', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Choose Your Speed</text>

      <g transform="translate(0, 90)">
        <rect width="270" height="50" rx="10" fill="#1F1B2E"/>
        <text x="15" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Infinix Hot 40i</text>
        <text x="255" y="30" font-family="'Satoshi', sans-serif" font-size="13" font-weight="800" fill="#FDE047" text-anchor="end">KSh 70/day</text>

        <rect y="60" width="270" height="50" rx="10" fill="#1F1B2E"/>
        <text x="15" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Samsung Galaxy A05</text>
        <text x="255" y="90" font-family="'Satoshi', sans-serif" font-size="13" font-weight="800" fill="#FDE047" text-anchor="end">KSh 85/day</text>
      </g>

      <text x="135" y="248" font-family="'Satoshi', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Free 5GB Safari Bundle with every purchase</text>
    </g>
  </g>

  <!-- Instagram Story / Reel Vertical Format (1080x1920 ratio preview) -->
  <g transform="translate(800, 140)" filter="url(#post-shadow)">
    <rect width="320" height="560" rx="24" fill="#140606" stroke="#DC2626" stroke-width="2"/>
    <g transform="translate(30, 45)">
      <!-- Top story progress bar -->
      <line x1="0" y1="0" x2="260" y2="0" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
      
      <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FDE047">FLASH PROMOTION</text>
      <text x="0" y="95" font-family="'Clash Display', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">DON'T MISS</text>
      <text x="0" y="135" font-family="'Clash Display', sans-serif" font-size="34" font-weight="700" fill="#DC2626">OUT!</text>

      <circle cx="130" cy="250" r="75" fill="#DC2626" opacity="0.3"/>
      <!-- Device outline in Story -->
      <rect x="70" y="180" width="120" height="190" rx="14" fill="#000000" stroke="#FDE047" stroke-width="2"/>
      <text x="130" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">NEW STOCK</text>

      <rect y="400" width="260" height="48" rx="24" fill="#DC2626"/>
      <text x="130" y="430" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SWIPE UP TO QUALIFY</text>
    </g>
  </g>
</svg>
