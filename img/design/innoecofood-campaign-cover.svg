<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="eco-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E16"/>
      <stop offset="60%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="eco-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#22C55E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#eco-bg)"/>

  <!-- Left Side: Copy -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#22C55E" fill-opacity="0.2" stroke="#4ADE80" stroke-opacity="0.6"/>
    <circle cx="18" cy="17" r="4" fill="#4ADE80"/>
    <text x="32" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#4ADE80" letter-spacing="1.5">AGRITECH SUSTAINABILITY</text>

    <text x="0" y="95" font-family="'Clash Display', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">InnoEcoFood</text>
    <text x="315" y="95" font-family="'Playfair Display', serif" font-style="italic" font-size="44" fill="#86EFAC">Campaign</text>

    <text x="0" y="145" font-family="'Satoshi', sans-serif" font-size="19" fill="#A7F3D0">Circular Agriculture &amp; Food Security Awareness Graphics</text>
    <text x="0" y="175" font-family="'Satoshi', sans-serif" font-size="15" fill="#6EE7B7">Infographic Posters • Advocacy Brochures • Social Awareness Kit • Field Guides</text>

    <g transform="translate(0, 230)" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#F0FDF4">
      <circle cx="12" cy="12" r="6" fill="#4ADE80"/>
      <text x="32" y="17">Bio-waste to High-Protein Feed Infographics</text>

      <circle cx="12" cy="52" r="6" fill="#FDE047"/>
      <text x="32" y="57">Farmer Training Pictograms &amp; Visual Diagrams</text>

      <circle cx="12" cy="92" r="6" fill="#4ADE80"/>
      <text x="32" y="97">EU-Africa Research Dissemination Collateral</text>
    </g>

    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#064E3B"/>
      <text x="35" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2024</text>
      <rect x="80" y="0" width="130" height="28" rx="6" fill="#064E3B"/>
      <text x="145" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Marketing Design</text>
      <rect x="220" y="0" width="120" height="28" rx="6" fill="#064E3B"/>
      <text x="280" y="18" font-family="'Satoshi', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Posters &amp; Flyers</text>
    </g>
  </g>

  <!-- Right Side: Editorial Infographic Poster Display -->
  <g transform="translate(680, 140)" filter="url(#eco-shadow)">
    <!-- Poster Frame -->
    <rect width="380" height="520" rx="16" fill="#FFFFFF" stroke="#4ADE80" stroke-width="2"/>
    <g transform="translate(35, 45)">
      <!-- Top Eyebrow -->
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#16A34A" letter-spacing="2">EU HORIZON PARTNERSHIP</text>
      <text x="0" y="38" font-family="'Clash Display', sans-serif" font-size="28" font-weight="700" fill="#064E3B">CIRCULAR ECO FOOD</text>
      <text x="0" y="65" font-family="'Playfair Display', serif" font-style="italic" font-size="22" fill="#16A34A">Empowering Smallholder Farmers</text>

      <!-- Central Circular Infographic -->
      <g transform="translate(155, 175)">
        <circle cx="0" cy="0" r="75" fill="none" stroke="#DCFCE7" stroke-width="12"/>
        <circle cx="0" cy="0" r="75" fill="none" stroke="#22C55E" stroke-width="12" stroke-dasharray="140 330" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="50" fill="#052E16"/>
        <text x="0" y="-5" font-family="'Clash Display', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">85%</text>
        <text x="0" y="15" font-family="'Satoshi', sans-serif" font-size="9" fill="#86EFAC" text-anchor="middle">FEED RECYCLING</text>
      </g>

      <!-- 3 Flow Steps -->
      <g transform="translate(0, 285)">
        <rect width="310" height="38" rx="8" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#064E3B">1. Agri-waste collection &amp; sorting</text>

        <rect y="46" width="310" height="38" rx="8" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
        <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#064E3B">2. Insect bioconversion processing</text>

        <rect y="92" width="310" height="38" rx="8" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1"/>
        <text x="14" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#064E3B">3. Organic aquaculture feed distribution</text>
      </g>

      <!-- Bottom Partner Footer -->
      <line x1="0" y1="440" x2="310" y2="440" stroke="#E2E8F0" stroke-width="1"/>
      <text x="0" y="462" font-family="'Satoshi', sans-serif" font-size="10" fill="#64748B">Kenya • Uganda • Tanzania • EU Research</text>
    </g>
  </g>
</svg>
